    <script>
        let myObj = {
            's1': 'amy',
            's2': 'bob',
            's3': 'cat',
            showData: function (s2var) {
                Object.values(this).forEach(function (A) {
                    console.log("HELLO~", A);
                });
                //console.log(this[s2var]);
            },

            showNum: function (year, M, P) {
                let Gold = M;
                for (i = 0; i < year; i++) {
                    console.log("第", (i + 1), "年 總金額", Gold);
                    Gold = Gold * P;
                }
            }
        }
        let Mydata = new Array();

        function runMydata(year, M, P) {
            let Gold = Number(M);
            let Mydata = [];
            //for (j = 0; j < 5; j++) {
            console.log("================================");
            for (j = 0; j < year; j++) {
                Mydata[j] = new Array(year - j);
                if (j == 0) {
                    Gold = Number(M);
                } else {
                    Gold = Number(Mydata[j - 1][1]) + Number(M);
                    /*
                    console.log("Mydata[j - 1][1]", Mydata[j - 1][1]);
                    console.log("M", M);
                    console.log("GOLD", Gold);
                    */
                }
                for (i = 0; i < year - j; i++) {
                    Mydata[j][i] = Number(Gold);
                    Gold = Number(Gold) * Number(P);
                }
            }
            //console.log(Mydata);

            //顯示標頭
            // 獲取 title 元素
            let ttitle = document.getElementById("dataTitle");
            ttitle.innerHTML = "";
            let tr = document.createElement("tr");
            for (i = 0; i < year + 1; i++) {
                let th = document.createElement("th");
                if (i == 0)
                    th.textContent = "年"; // 年份（從1開始）
                else
                    th.textContent = i; // 年份（從1開始）
                tr.appendChild(th);
            }
            // 將 tr 加到 tbody 中
            ttitle.appendChild(tr);
            console.log("================================");
            // 獲取 tbody 元素
            let tbody = document.getElementById("dataBody");
            //console.log(tbody);
            // 清空 tbody（若需要重新填充）
            tbody.innerHTML = "";

            // 遍歷 Mydata 陣列，並將每年金額插入到表格中
            let tr1;
            let tdAmount;
            //for (j = 0; j < 5; j++) {
            for (j = 0; j < year; j++) {
                tr1 = document.createElement("tr");
                tdAmount = document.createElement("td");
                tdAmount.textContent = "第" + (j + 1) + "年";
                tr1.appendChild(tdAmount);
                for (k = 0; k < j; k++) {
                    tdAmount = document.createElement("td");
                    tr1.appendChild(tdAmount);
                }
                //console.log(Mydata);
                //console.log("j", j)
                Mydata[j].forEach((amount, index) => {
                    // 創建一個新的 tr 元素
                    tdAmount = document.createElement("td");
                    tdAmount.textContent = Math.round(amount * 100) / 100; // 顯示金額，保留兩位小數
                    //tdAmount.textContent = amount; // 顯示金額，保留兩位小數
                    tr1.appendChild(tdAmount);
                    //console.log("index", index)
                    //console.log("amount", amount)
                });
                // 將 tr 加到 tbody 中
                tbody.appendChild(tr1);
            }
        }

        function comp() {
            let MM = $("#mm").val();
            let PI = $("#Pi").val();
            console.log("Year", mm);
            console.log("PI", PI);

            runMydata(10, MM, PI)
        }
