<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- link css 順序 1.bs 2.self -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.css" />
</head>

<body>

    <div class="container mt-3">
        <h2>Hover Rows</h2>
        <p>The .table-hover class enables a hover state (grey background on mouse over) on table rows:</p>
        <table class="table table-hover" id="myTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th id="time1">time1</th>
                    <th id="time2">time2</th>
                    <th id="time3">time3</th>
                </tr>
            </thead>
            <tbody>
                <!-- <tr>
                    <td>1</td>
                    <td>新北市</td>
                </tr> -->
            </tbody>
        </table>
    </div>


    <!-- js include 順序 1.bs 2.jq 3.self -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"
        integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdn.datatables.net/2.2.2/js/dataTables.js"></script>        
    <script>
        $(document).ready(function () {
            let pwd = "CWA-4D9B0BA1-C251-4000-BC11-241EF942BCC1";
            console.log('pwd', pwd);

            // 1.bind
            const myTable = $('#myTable');
            const myTbody = myTable.find('tbody');
            console.log('myTbody', myTbody);


            // 2.action

            let url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${pwd}`;
            $.ajax({
                type: "get",
                url: url,
                // data: "data",
                dataType: "Json",
                success: function (res) {
                    console.log('res', res);
                    let data = res.records.location[3].locationName;
                    data = res.records.location;
                    console.log('data', data);

                    $.each(data, function (key, value) {
                        // console.log('key', key);
                        // console.log('value', value.locationName);

                        let tmpLocationName = value.locationName;
                        let tmpLocationID = key;
                        let tmpWeatherElement = value.weatherElement;
                        console.log('tmpWeatherElement', tmpWeatherElement);
                        console.log('tmpWeatherElement[2]', tmpWeatherElement[2].time[0]);

                        //console.log('tmpWeatherElement[4]', tmpWeatherElement[4]);

                        // 1.地名
                        console.log('tmpLocationName', tmpLocationName);


                        $('#time1').text(tmpWeatherElement[2].time[0].startTime.substr(11, 2) + "到" + tmpWeatherElement[2].time[0].endTime.substr(11, 2));
                        $('#time2').text(tmpWeatherElement[2].time[1].startTime.substr(11, 2) + "到" + tmpWeatherElement[2].time[1].endTime.substr(11, 2));
                        $('#time3').text(tmpWeatherElement[2].time[2].startTime.substr(11, 2) + "到" + tmpWeatherElement[2].time[2].endTime.substr(11, 2));
                        let dn = [];
                        if(tmpWeatherElement[2].time[0].startTime.substr(11, 2) == '06')
                            dn[0] = 'day'
                        else
                            dn[0] = 'night'
                        if(tmpWeatherElement[2].time[1].startTime.substr(11, 2) == '06')
                            dn[1] = 'day'
                        else
                            dn[1] = 'night'
                        if(tmpWeatherElement[2].time[2].startTime.substr(11, 2) == '06')
                            dn[2] = 'day'
                        else
                            dn[2] = 'night'

                        // 2.table
                        let temText = `
                            <tr>
                                <td>${tmpLocationID + 1}</td>
                                <td>${tmpLocationName}</td>
                                <td>${tmpWeatherElement[2].time[0].parameter.parameterName}度 - ${tmpWeatherElement[4].time[0].parameter.parameterName}度
                                        <img src="./${dn[0]}/${tmpWeatherElement[0].time[0].parameter['parameterValue']}.svg" alt="" srcset="">
                                </td>
                                <td>${tmpWeatherElement[2].time[1].parameter.parameterName}度 - ${tmpWeatherElement[4].time[1].parameter.parameterName}度
                                    <img src="./${dn[1]}/${tmpWeatherElement[0].time[1].parameter['parameterValue']}.svg" alt="" srcset="">
                                </td>
                                <td>${tmpWeatherElement[2].time[2].parameter.parameterName}度 - ${tmpWeatherElement[4].time[2].parameter.parameterName}度
                                    <img src="./${dn[2]}/${tmpWeatherElement[0].time[2].parameter['parameterValue']}.svg" alt="" srcset="">
                                </td>
                            </tr>`;
                        $(myTbody).append(temText);
                    });
                    let table = new DataTable('#myTable', 
                            {
                                language: {
                                        "lengthMenu": "顯示 _MENU_ 筆資料",
                                        "sProcessing": "處理中...",
                                        "sZeroRecords": "没有匹配结果",
                                        "sInfo": "目前有 _MAX_ 筆資料",
                                        "sInfoEmpty": "目前共有 0 筆紀錄",
                                        "sInfoFiltered": " ",
                                        "sInfoPostFix": "",
                                        "sSearch": "搜尋:",
                                        "sUrl": "",
                                        "sEmptyTable": "尚未有資料紀錄存在",
                                        "sLoadingRecords": "載入資料中...",
                                        "sInfoThousands": ",",
                                        "oPaginate": {
                                            "sFirst": "首頁",
                                            "sPrevious": "上一頁",
                                            "sNext": "下一頁",
                                            "sLast": "末頁"
                                        },
                                        "order": [
                                            [0, "desc"]
                                        ],
                                        "oAria": {
                                            "sSortAscending": ": 以升序排列此列",
                                            "sSortDescending": ": 以降序排列此列"
                                        }
                                    },
                            });
                }
            });



        });
    </script>
</body>

</html>
